<div class="overlay" id="add-overlay">
  <div class="modal" style="max-width:500px;width:95%">
    <h3 id="form-title" data-i18n="addTitle">x</h3>
    <p id="form-hint"></p>
    <div class="dns-form">
      <div class="two-col">
        <div class="field"><label data-i18n="fieldName">x</label><input type="text" id="f-name" placeholder="Pi-hole" maxlength="60" autocomplete="off"></div>
        <div class="field"><label data-i18n="fieldType">x</label><select id="f-type" data-on-change="typeChanged"><option value="pihole">Pi-hole</option><option value="adguard">AdGuard Home</option></select></div>
      </div>
      <div class="field"><label data-i18n="fieldUrl">x</label><input type="text" id="f-url" placeholder="http://192.0.2.5" autocomplete="off"></div>
      <div class="two-col">
        <div class="field" id="user-wrap"><label data-i18n="fieldUser">x</label><input type="text" id="f-user" autocomplete="off"></div>
        <div class="field"><label id="pass-lbl">x</label><input type="password" id="f-pass" autocomplete="new-password"><span class="secret-hint" id="h-password"></span></div>
      </div>
      <div class="two-col">
        <div class="field"><label data-i18n="fieldTimeout">x</label><input type="number" id="f-timeout" value="8" min="1" max="30"></div>
        <div class="field"><label class="remember-chk" style="margin-top:22px"><input type="checkbox" id="f-tls" checked><span data-i18n="fieldTls">x</span></label></div>
      </div>
      <div class="test-result" id="test-result"></div>
    </div>
    <div class="modal-acts">
      <button class="btn-mc" data-on-click="closeModals" data-i18n="cancel">x</button>
      <button class="btn-secondary" id="btn-test" data-on-click="testServer" style="width:auto;padding:8px 14px" data-i18n="test">x</button>
      <button class="btn-primary" id="btn-save" data-on-click="saveServer" style="width:auto;padding:8px 14px" data-i18n="save">x</button>
    </div>
  </div>
</div>
