<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LabTower"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#f0f2f5" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)"><meta name="format-detection" content="telephone=no">
<title>LabTower — 2FA</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="change-password.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<!-- Pantalla de 2FA obligatorio. Se llega aquí tras iniciar sesión con una cuenta de administrador sin 2FA cuando la política lo exige. Hasta activarlo, el servidor no da acceso a ningún módulo. -->
<!-- EN: Mandatory 2FA screen. You get here after signing in with an administrator account without 2FA when the policy requires it. Until it is on, the server grants access to no module. -->
<div class="box">
  <div class="logo">
    <div class="logo-ico"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>
    <div class="logo-name">LabTower</div>
  </div>
  <h2 id="t-title"></h2>
  <div class="sub" id="t-sub"></div>
  <div class="error-msg" id="err"></div>
  <div id="step1">
    <div class="field"><label id="t-cur"></label><input type="password" id="cur" autocomplete="current-password" autofocus></div>
    <button class="btn" id="btn1" data-on-click="begin"></button>
  </div>
  <div id="step2" hidden>
    <div class="sub" id="t-scan"></div>
    <div class="qr" id="qr"></div>
    <div class="sub" id="t-manual"></div>
    <pre class="key" id="key"></pre>
    <div class="field"><label id="t-code"></label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></div>
    <button class="btn" id="btn2" data-on-click="confirmCode"></button>
  </div>
  <div id="step3" hidden>
    <div class="notice" id="t-rec"></div>
    <pre class="key" id="rec"></pre>
    <button class="btn" id="btn3" data-on-click="done"></button>
  </div>
  <button class="link" id="t-out" data-on-click="logout"></button>
</div>
<script src="csp-bind.js"></script>
<script src="setup-2fa.js"></script>
<script src="footer.js"></script>
</body>
</html>
