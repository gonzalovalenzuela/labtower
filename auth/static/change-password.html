<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pi Console"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#f0f2f5" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)"><meta name="format-detection" content="telephone=no">
<title>Pi Console — Password</title>
<link rel="stylesheet" href="change-password.css">
</head>
<body>
<!-- Pantalla de cambio obligatorio de contraseña. Se llega aquí tras iniciar sesión con una cuenta marcada must_change_password (p. ej. admin/admin en una instalación nueva). Hasta cambiarla, el servidor no da acceso a ningún módulo. -->
<!-- EN: Mandatory password-change screen. You get here after logging in with an account flagged must_change_password (e.g. admin/admin on a fresh install). Until it is changed, the server grants access to no module. -->
<div class="box">
  <div class="logo">
    <div class="logo-ico"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>
    <div class="logo-name">Pi Console</div>
  </div>
  <h2 id="t-title"></h2>
  <div class="sub" id="t-sub"></div>
  <div class="notice" id="t-notice"></div>
  <div class="error-msg" id="err"></div>
  <div class="field"><label id="t-cur"></label><input type="password" id="cur" autocomplete="current-password" autofocus></div>
  <div class="field"><label id="t-new"></label><input type="password" id="pw1" autocomplete="new-password"></div>
  <div class="field"><label id="t-rep"></label><input type="password" id="pw2" autocomplete="new-password"></div>
  <button class="btn" id="btn" data-on-click="save"></button>
  <button class="link" id="t-out" data-on-click="logout"></button>
</div>
<script src="csp-bind.js"></script>
<script src="change-password.js"></script>
</body>
</html>
