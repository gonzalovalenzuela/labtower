<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi Console — Password</title>
<style>
:root{--input-bg:#e7ebf2;--input-border:#c3cbda;--bg:#f0f2f5;--surface:#fff;--border:#e3e8ef;--blue:#4361ee;--blue-dim:rgba(67,97,238,.1);--red:#ef4444;--red-dim:rgba(239,68,68,.1);--amber:#b45309;--amber-dim:rgba(245,158,11,.12);--text:#1a2033;--text-mid:#5a6a85;--text-dim:#94a3b8;--r:10px;--r-sm:6px;--shadow-md:0 4px 16px rgba(0,0,0,.1);--sans:system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root{--input-bg:#1c2333;--input-border:#334057;--bg:#0f1420;--surface:#161d2c;--border:#273247;--text:#e6eaf2;--text-mid:#a3b0c7;--text-dim:#6b7a94;--amber:#fbbf24}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:32px;width:100%;max-width:380px;box-shadow:var(--shadow-md)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.logo-ico{width:36px;height:36px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center}
.logo-ico svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
.logo-name{font-size:16px;font-weight:600}
h2{font-size:18px;font-weight:600;margin-bottom:6px}
.sub{font-size:13px;color:var(--text-mid);margin-bottom:18px;line-height:1.45}
.notice{background:var(--amber-dim);border:1px solid rgba(245,158,11,.3);border-radius:var(--r-sm);padding:10px 14px;font-size:12px;color:var(--amber);margin-bottom:18px;line-height:1.45}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
label{font-size:11px;font-weight:600;color:var(--text-mid)}
input{background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--r-sm);color:var(--text);font-family:var(--sans);font-size:13px;padding:9px 12px;outline:none;width:100%}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-dim)}
.btn{background:var(--blue);color:#fff;border:none;border-radius:var(--r-sm);font-family:var(--sans);font-size:13px;font-weight:600;padding:11px;cursor:pointer;width:100%;margin-top:4px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{display:block;text-align:center;margin-top:14px;font-size:12px;color:var(--text-dim);cursor:pointer;background:none;border:none;width:100%}
.error-msg{background:var(--red-dim);border:1px solid rgba(239,68,68,.2);border-radius:var(--r-sm);padding:10px 14px;font-size:12px;color:var(--red);margin-bottom:16px;display:none}
.error-msg.show{display:block}
</style>
</head>
<body>
<!-- Pantalla de cambio obligatorio de contraseña. Se llega aquí tras iniciar sesión con una cuenta marcada must_change_password (p. ej. admin/admin en una instalación nueva). Hasta cambiarla, el servidor no da acceso a ningún módulo. -->
<!-- EN: Mandatory password-change screen. You get here after logging in with an account flagged must_change_password (e.g. admin/admin on a fresh install). Until it is changed, the server grants access to no module. -->
<div class="box">
  <div class="logo">
    <div class="logo-ico"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>
    <div class="logo-name">Pi Console</div>
  </div>
  <h2 id="t-title"></h2>
  <div class="sub" id="t-sub"></div>
  <div class="notice" id="t-notice"></div>
  <div class="error-msg" id="err"></div>
  <div class="field"><label id="t-cur"></label><input type="password" id="cur" autocomplete="current-password" autofocus></div>
  <div class="field"><label id="t-new"></label><input type="password" id="pw1" autocomplete="new-password"></div>
  <div class="field"><label id="t-rep"></label><input type="password" id="pw2" autocomplete="new-password"></div>
  <button class="btn" id="btn" onclick="save()"></button>
  <button class="link" id="t-out" onclick="logout()"></button>
</div>
<script>
// Textos en inglés y español; el idioma es el elegido en los módulos (pi-lang) y, si no hay, el del navegador.
// EN: English and Spanish texts; the language is the one chosen in the modules (pi-lang) and, if none, the browser's.
const TXT = {
  en:{title:'Set a new password',sub:'For security, you must choose a new password before using Pi Console.',notice:'This account still has its initial or temporary password.',cur:'Current password',nw:'New password (min. 6 characters)',rep:'Repeat new password',btn:'Save and continue',out:'Sign out',
      mismatch:'The passwords do not match',short:'The password must be at least 6 characters',same:'The new password must be different from the current one',fill:'Fill in all the fields',saving:'Saving…',conn:'Connection error: '},
  es:{title:'Define una contraseña nueva',sub:'Por seguridad, debes elegir una contraseña nueva antes de usar Pi Console.',notice:'Esta cuenta aún tiene su contraseña inicial o temporal.',cur:'Contraseña actual',nw:'Contraseña nueva (mín. 6 caracteres)',rep:'Repite la contraseña nueva',btn:'Guardar y continuar',out:'Cerrar sesión',
      mismatch:'Las contraseñas no coinciden',short:'La contraseña debe tener al menos 6 caracteres',same:'La contraseña nueva debe ser distinta de la actual',fill:'Completa todos los campos',saving:'Guardando…',conn:'Error de conexión: '}
};
let lang = 'en';
try { lang = localStorage.getItem('pi-lang') || ''; } catch(e) {}
if (!TXT[lang]) lang = (navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'en';
const T = TXT[lang];
document.documentElement.lang = lang;
document.title = 'Pi Console — ' + T.title;
document.getElementById('t-title').textContent = T.title;
document.getElementById('t-sub').textContent = T.sub;
document.getElementById('t-notice').textContent = T.notice;
document.getElementById('t-cur').textContent = T.cur;
document.getElementById('t-new').textContent = T.nw;
document.getElementById('t-rep').textContent = T.rep;
document.getElementById('btn').textContent = T.btn;
document.getElementById('t-out').textContent = T.out;

// Destino tras el cambio: solo rutas internas del mismo sitio (nunca //host ni URLs absolutas).
// EN: Destination after the change: only internal paths of the same site (never //host or absolute URLs).
let next = new URLSearchParams(location.search).get('next') || '/';
if (!/^\/(?![\/\\])/.test(next)) next = '/';

// Sin sesión, vuelve al destino (que mostrará su pantalla de login). Si la cuenta ya no necesita cambiar, entra directo.
// EN: Without a session, go back to the destination (which shows its own login). If the account no longer needs a change, go straight in.
fetch('api/self').then(r => r.json()).then(d => {
  if (!d.username || !d.must_change_password) location.replace(next);
}).catch(() => {});

document.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });

// Muestra un mensaje de error encima del formulario.
// EN: Show an error message above the form.
function showErr(m) { const e = document.getElementById('err'); e.textContent = m; e.className = 'error-msg show'; }

// Valida en el cliente solo por comodidad (el servidor vuelve a validar todo) y envía el cambio.
// EN: Validate on the client only for convenience (the server validates everything again) and send the change.
async function save() {
  const cur = document.getElementById('cur').value;
  const p1  = document.getElementById('pw1').value;
  const p2  = document.getElementById('pw2').value;
  const btn = document.getElementById('btn');
  document.getElementById('err').className = 'error-msg';
  if (!cur || !p1 || !p2) return showErr(T.fill);
  if (p1.trim().length < 6) return showErr(T.short);
  if (p1 !== p2) return showErr(T.mismatch);
  if (p1 === cur) return showErr(T.same);
  btn.disabled = true; btn.textContent = T.saving;
  try {
    const r = await fetch('api/self_password', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({current_password: cur, new_password: p1})
    });
    const d = await r.json();
    if (!r.ok || !d.ok) {
      if (r.status === 401) { location.replace(next); return; }   // session expired: back to the login
      showErr(d.error || 'Error'); btn.disabled = false; btn.textContent = T.btn; return;
    }
    location.replace(next);
  } catch (e) {
    showErr(T.conn + e.message); btn.disabled = false; btn.textContent = T.btn;
  }
}

// Cierra la sesión pendiente y vuelve al destino.
// EN: Close the pending session and go back to the destination.
async function logout() {
  try { await fetch('api/logout', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'}); } catch(e) {}
  location.replace(next);
}
</script>
</body>
</html>
