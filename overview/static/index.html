<style>
:root{--bg:#f0f2f5;--surface:#fff;--surface2:#f6f8fb;--border:#e3e8ef;--border-b:#cdd4e0;--blue:#4361ee;--blue-dim:rgba(67,97,238,.1);--green:#16a34a;--green-dim:rgba(34,197,94,.12);--amber:#b45309;--amber-dim:rgba(245,158,11,.14);--red:#dc2626;--red-dim:rgba(239,68,68,.12);--text:#1a2033;--text-mid:#5a6a85;--text-dim:#8190a8;--track:#e6ebf3;--r:12px;--r-sm:8px;--shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);--sans:system-ui,-apple-system,'Segoe UI',sans-serif;--mono:ui-monospace,'SF Mono',Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--surface:#161d2c;--surface2:#1b2336;--border:#273247;--border-b:#334057;--green:#4ade80;--green-dim:rgba(74,222,128,.14);--amber:#fbbf24;--amber-dim:rgba(251,191,36,.14);--red:#f87171;--red-dim:rgba(248,113,113,.14);--text:#e6eaf2;--text-mid:#a3b0c7;--text-dim:#6b7a94;--track:#232d42;--shadow:0 1px 3px rgba(0,0,0,.4)}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{max-width:1320px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:1.25rem;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--blue);display:inline-flex;align-items:center;justify-content:center}
.logo svg{width:16px;height:16px;fill:#fff}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;font-size:.8rem;font-weight:600;border:1px solid transparent}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.ok{color:var(--green);background:var(--green-dim)}.warn{color:var(--amber);background:var(--amber-dim)}.crit{color:var(--red);background:var(--red-dim)}.none{color:var(--text-dim);background:var(--surface2)}
.btn{background:var(--surface);border:1px solid var(--border-b);color:var(--text-mid);border-radius:var(--r-sm);padding:6px 11px;font:inherit;font-size:.8rem;cursor:pointer}
.btn:hover{color:var(--text);border-color:var(--text-dim)}
.upd{font-size:.72rem;font-family:var(--mono);color:var(--text-dim)}
.attn{display:none;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--amber);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.attn.show{display:block}.attn.c{border-left-color:var(--red)}
.attn li{list-style:none;font-size:.85rem;padding:3px 0;display:flex;gap:8px;align-items:baseline}
.attn li b{font-size:.7rem;text-transform:uppercase;letter-spacing:.4px;min-width:64px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.wide{grid-column:1/-1}
.ch{display:flex;align-items:center;gap:8px}
.ch h2{font-size:.95rem;font-weight:650;flex:1}
.ch .pill{padding:3px 10px;font-size:.72rem}
.ch a.go{font-size:.75rem;color:var(--blue)}
.sub{font-size:.78rem;color:var(--text-mid)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
.kpi{background:var(--surface2);border-radius:var(--r-sm);padding:8px 10px}
.kpi b{display:block;font-size:1.35rem;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.kpi span{font-size:.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.bar>div{height:100%;border-radius:99px;background:var(--blue);transition:width .5s}
.bar.g>div{background:var(--green)}.bar.w>div{background:var(--amber)}.bar.c>div{background:var(--red)}
.row{display:flex;align-items:center;gap:10px;font-size:.82rem}
.row .l{width:62px;color:var(--text-mid);flex-shrink:0}.row .bar{flex:1}.row .v{width:62px;text-align:right;font-family:var(--mono);font-size:.78rem}
.unit{border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.unit:first-of-type{border-top:0;padding-top:0}
.uh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.88rem}
.uh .pill{padding:2px 9px;font-size:.7rem;margin-left:auto}
svg.spark{width:100%;height:42px;display:block}
.hc{font-size:.68rem;color:var(--text-mid);line-height:1.35}
.hc i{display:inline-block;width:8px;height:8px;border-radius:2px;margin:0 4px 0 9px}
.hc i:first-child{margin-left:0}
.hc b{font-weight:600}
@media (max-height:900px){body.kiosk .xh{display:none}}
.donutbox{display:flex;align-items:center;gap:14px}
.legend{display:flex;flex-direction:column;gap:3px;font-size:.76rem;color:var(--text-mid)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.legend>div{display:flex;align-items:center;min-width:0}
.legend .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.legend .ln{flex:none;white-space:nowrap;margin-left:4px}
.legend .ls{display:none}
.legend.lg2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-gap:3px 12px;gap:3px 12px;flex:1;min-width:0}
.list{display:flex;flex-direction:column;gap:5px;font-size:.8rem}
.list div{display:flex;gap:8px;align-items:baseline}
.list code{font-family:var(--mono);font-size:.76rem;color:var(--text-mid);flex-shrink:0}
.list div>.pill{flex-shrink:0}
.list div>span:last-child{min-width:0;overflow-wrap:anywhere}
.tl{display:flex;flex-direction:column;max-height:340px;overflow:auto}
.ev{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border);font-size:.82rem}
.ev:last-child{border-bottom:0}
.ev .d{width:9px;height:9px;border-radius:50%;flex-shrink:0;align-self:center}
.ev .d.info{background:var(--green)}.ev .d.warn{background:var(--amber)}.ev .d.crit{background:var(--red)}
.ev .m{font-size:.66rem;text-transform:uppercase;letter-spacing:.4px;color:var(--text-dim);width:42px;flex-shrink:0}
.ev .t{margin-left:auto;font-size:.72rem;color:var(--text-dim);white-space:nowrap;font-family:var(--mono)}
.empty{color:var(--text-dim);font-size:.82rem;padding:6px 0}
.login{max-width:340px;margin:12vh auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.login input{background:var(--surface2);border:1px solid var(--border-b);border-radius:var(--r-sm);color:var(--text);font:inherit;padding:9px 12px;width:100%}
.login .btn{background:var(--blue);color:#fff;border:0;padding:10px;font-weight:600}
.login .err{color:var(--red);font-size:.8rem;min-height:1em}
.hide{display:none!important}
/* Modo kiosko: letra grande, sin controles; pensado para dejarlo en un monitor o tablet fijo. */
/* EN: Kiosk mode: large text, no controls; meant for a fixed monitor or tablet. */
body.kiosk{cursor:none}
html.kiosk{font-size:19px;font-size:calc(19px*var(--kz,1))}
body.kiosk .wrap{max-width:none;padding:18px 24px}
body.kiosk .nokiosk{display:none!important}
body.kiosk .grid{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
body.kiosk .tl{max-height:none}
/* deja sitio al botón fijo "Salir de kiosko" para que no tape la hora de actualización */
/* EN: leave room for the fixed "Exit kiosk" button so it doesn't cover the update time */
body.kiosk .top{padding-right:17rem}
/* Pantallas más chicas (tablet de 7", portátil): letra y columnas más compactas. Se puede ajustar con ?zoom=0.8 (0.5–2). */
/* EN: Smaller screens (7" tablet, laptop): more compact text and columns. Adjustable with ?zoom=0.8 (0.5–2). */
@media (max-width:1599px){html.kiosk{font-size:16px;font-size:calc(16px*var(--kz,1))}}
@media (max-width:1199px){html.kiosk{font-size:14px;font-size:calc(14px*var(--kz,1))}}
@media (max-width:899px){html.kiosk{font-size:12.5px;font-size:calc(12.5px*var(--kz,1))}}
/* Tablet chica o portátil (≤ 1399 px de ancho): tarjetas más compactas para que quepan más datos por pantalla. */
/* EN: Small tablet or laptop (≤ 1399 px wide): more compact cards so more data fits on the screen. */
@media (max-width:1399px){
body.kiosk .wrap{padding:8px 10px}
body.kiosk .top{margin-bottom:8px}
body.kiosk .grid{gap:8px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
body.kiosk .card{padding:9px 11px;gap:7px}
html.nfg.kiosk .card>*+*{margin-top:7px}
body.kiosk .unit{gap:5px;padding-top:7px}
html.nfg.kiosk .unit>*+*{margin-top:5px}
body.kiosk .kpis{gap:6px;grid-template-columns:repeat(auto-fit,minmax(64px,1fr))}
body.kiosk .kpi{padding:5px 8px}
body.kiosk .kpi b{font-size:1.15rem}
body.kiosk .attn{padding:6px 10px;margin-bottom:8px}
body.kiosk .ev{padding:4px 0}
body.kiosk .uh{flex-wrap:wrap}
body.kiosk .pill{white-space:nowrap}
body.kiosk .list div{flex-wrap:wrap}
body.kiosk .list .pill{padding:1px 8px;font-size:.62rem}
body.kiosk .legend.lg2{grid-gap:1px 6px;gap:1px 6px;font-size:.64rem}
body.kiosk .legend.lg2 .lf{display:none}
body.kiosk .legend.lg2 .ls{display:inline}
body.kiosk .legend i{margin-right:4px}
body.kiosk .donutbox{gap:8px}
body.kiosk .donutbox>svg{width:58px;height:58px;flex:none}
body.kiosk .list div>span:last-child{flex:1 1 100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-mid)}
}
/* Además, si es baja (landscape de 7"): sin gráficos de 24 h, 4 eventos y leyenda corta. */
/* EN: And if it is short (7" landscape): no 24 h charts, 4 events and a short legend. */
@media (max-width:1399px) and (max-height:700px){
body.kiosk svg.spark,body.kiosk .hc{display:none}
body.kiosk .kp svg.spark{display:block;height:28px}
body.kiosk .kp .hc{display:block;font-size:.62rem}
body.kiosk .tl .ev:nth-child(n+5){display:none}
body.kiosk .list>div:nth-child(n+3){display:none}
}
#kbar{display:none;position:fixed;top:10px;right:10px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#kbar .btn{margin-left:8px}
body.kiosk #kbar{display:block}body.kiosk.moved #kbar{opacity:1;pointer-events:auto}
body.kiosk.moved #kbar .btn{cursor:pointer}
#ka.on{background:var(--blue-dim);color:var(--blue);border-color:var(--blue)}
/* Respaldo para navegadores sin "gap" en flexbox (Safari < 14.1, p. ej. iPad Air 1 / iOS 12): la clase nfg la pone el script del <head>. */
/* EN: Fallback for browsers without flexbox "gap" (Safari < 14.1, e.g. iPad Air 1 / iOS 12): the nfg class is set by the <head> script. */
.nfg .top{margin:0 -12px 4px 0}
.nfg .top>*{margin:0 12px 12px 0}
.nfg .top h1>*+*{margin-left:10px}
.nfg .pill i{margin-right:7px}
.nfg .attn li b{margin-right:8px}
.nfg .card>*+*{margin-top:12px}
.nfg .ch>*+*{margin-left:8px}
.nfg .row>*+*{margin-left:10px}
.nfg .unit>*+*{margin-top:8px}
.nfg .uh .sub{margin:0 8px}
.nfg .uh .pill{margin-left:auto}
.nfg .donutbox>*+*{margin-left:14px}
.nfg .legend>*+*{margin-top:3px}
.nfg .legend.lg2>*+*{margin-top:0}
.nfg .list>*+*{margin-top:5px}
.nfg .list div>*+*{margin-left:8px}
.nfg .ev>*+*{margin-left:10px}
.nfg .ev .t{margin-left:auto;padding-left:10px}
.nfg .login>*+*{margin-top:12px}
@media (max-width:640px){.wrap{padding:12px}.row .l{width:52px}.grid{grid-template-columns:1fr}}
</style>
<script>
// Detecta si flexbox soporta "gap"; si no, activa los márgenes de respaldo (clase nfg).
// EN: Detects flexbox "gap" support; if missing, turns on the fallback margins (nfg class).
(function(){try{var d=document.createElement('div');d.style.cssText='display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';d.appendChild(document.createElement('div'));d.appendChild(document.createElement('div'));document.documentElement.appendChild(d);var ok=d.offsetHeight===1;document.documentElement.removeChild(d);if(!ok)document.documentElement.className+=' nfg'}catch(e){}})();

<body>
<!-- Resumen de Pi Console: estado global, tarjetas de UPS, Proxmox, red y Pi, y línea de tiempo de eventos. Consulta las APIs de los otros módulos con la misma sesión. -->
<!-- EN: Pi Console overview: global status, UPS, Proxmox, network and Pi cards, and an event timeline. It queries the other modules' APIs with the same session. -->
<div id="loginbox" class="login hide">
  <h1 style="font-size:1.1rem">Pi Console — <span data-i="title">Overview</span></h1>
  <input id="lu" placeholder="User" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password">
  <div class="err" id="lerr"></div><button class="btn" id="lgo" data-i="login">Sign in</button>
</div>

<div class="wrap hide" id="app">
  <div class="top">
    <h1><span class="logo"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></span><span data-i="title">Overview</span></h1>
    <span class="pill none" id="gpill"><i></i><span id="gtxt">…</span></span>
    <span class="spacer"></span>
    <span class="upd" id="upd"></span>
    <a class="btn nokiosk" href="/" data-i="home">Home</a>
    <button class="btn nokiosk" id="bk" data-i="kiosk">Kiosk</button>
    <button class="btn nokiosk" id="bl">ES</button>
    <button class="btn nokiosk" id="bo" data-i="logout">Sign out</button>
  </div>
  <div class="attn" id="attn"><ul id="attnl"></ul></div>
  <div class="grid" id="grid">
    <section class="card hide" id="c-nut"></section>
    <section class="card hide" id="c-pve"></section>
    <section class="card hide" id="c-net"></section>
    <section class="card" id="c-pi"></section>
    <section class="card wide" id="c-ev"></section>
  </div>
</div>
<div id="kbar"><button class="btn hide" id="ka" data-i="ascroll" aria-pressed="false">Auto-scroll</button><button class="btn" id="kx" data-i="exitk">Exit kiosk</button></div>

<script>
// ───────── Textos / texts ─────────
const TXT={
 en:{title:'Overview',home:'Home',kiosk:'Kiosk',logout:'Sign out',login:'Sign in',exitk:'Exit kiosk',ascroll:'Auto-scroll',updated:'Updated',allok:'All good',attn:'Attention',fail:'Failure',
  ups:'UPS Monitor',pve:'Proxmox',net:'Net Monitor',pi:'Raspberry Pi',ev:'Timeline',open:'Open →',noups:'No UPS servers configured',nopve:'No clusters configured',nonet:'No scan yet',noev:'No events yet',
  mains:'On mains',batt:'On battery',lowb:'Low battery',unreach:'Unreachable',battery:'Battery',load:'Load',runtime:'Runtime',power:'Power',nodes:'Nodes',vms:'VMs',cts:'CTs',cpu:'CPU',mem:'Memory',disk:'Disk',temp:'Temp',uptime:'Uptime',
  online:'Online',known:'Known',offline:'Offline',newdev:'New devices',lastscan:'Last scan',scanning:'Scanning…',ceph:'Ceph',types:'By device type',nonew:'No new devices',
  ago:'ago',now:'now',min:'min',h:'h',d:'d',s:'s',power_uv:'Under-voltage',power_th:'Throttled',power_ok:'Power supply OK',invalid:'Invalid credentials',
  issue_batt:'is running on battery',issue_lowb:'has low battery',issue_srv:'unreachable',issue_node:'node offline',issue_cl:'cluster unreachable',issue_cpu:'high CPU',issue_ram:'high memory',issue_ceph:'Ceph',
  issue_temp:'Pi temperature high',issue_disk:'Pi disk almost full',issue_mem:'Pi memory high',issue_pwr:'Pi power supply problem',issue_scan:'scan error',h_temp:'Temp',h_min:'min',h_max:'max',h_uv:'Under-voltage',h_nouv:'no under-voltage',h_utemp:'UPS temperature 24 h'},
 es:{title:'Resumen',home:'Inicio',kiosk:'Kiosko',logout:'Cerrar sesión',login:'Entrar',exitk:'Salir de kiosko',ascroll:'Auto-desplazar',updated:'Actualizado',allok:'Todo en orden',attn:'Atención',fail:'Falla',
  ups:'UPS Monitor',pve:'Proxmox',net:'Net Monitor',pi:'Raspberry Pi',ev:'Línea de tiempo',open:'Abrir →',noups:'Sin servidores UPS configurados',nopve:'Sin clusters configurados',nonet:'Aún sin escaneo',noev:'Sin eventos todavía',
  mains:'En red eléctrica',batt:'Con batería',lowb:'Batería baja',unreach:'Sin conexión',battery:'Batería',load:'Carga',runtime:'Autonomía',power:'Consumo',nodes:'Nodos',vms:'VMs',cts:'CTs',cpu:'CPU',mem:'Memoria',disk:'Disco',temp:'Temp',uptime:'Encendida',
  online:'En línea',known:'Conocidos',offline:'Apagados',newdev:'Equipos nuevos',lastscan:'Último escaneo',scanning:'Escaneando…',ceph:'Ceph',types:'Por tipo de equipo',nonew:'Sin equipos nuevos',
  ago:'hace',now:'ahora',min:'min',h:'h',d:'d',s:'s',power_uv:'Subtensión',power_th:'Limitada',power_ok:'Fuente de poder OK',invalid:'Credenciales inválidas',
  issue_batt:'funciona con batería',issue_lowb:'tiene batería baja',issue_srv:'sin conexión',issue_node:'nodo caído',issue_cl:'cluster sin conexión',issue_cpu:'CPU alta',issue_ram:'memoria alta',issue_ceph:'Ceph',
  issue_temp:'temperatura alta de la Pi',issue_disk:'disco de la Pi casi lleno',issue_mem:'memoria de la Pi alta',issue_pwr:'problema de alimentación de la Pi',issue_scan:'error de escaneo',h_temp:'Temp.',h_min:'mín',h_max:'máx',h_uv:'Subtensión',h_nouv:'sin subtensión',h_utemp:'Temperatura UPS 24 h'}
};
let lang='en';try{lang=localStorage.getItem('pi-lang')||''}catch(e){}
if(!TXT[lang])lang=(navigator.language||'').toLowerCase().startsWith('es')?'es':'en';
const T=k=>TXT[lang][k]||k;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ───────── Utilidades / helpers ─────────
const LV={ok:0,none:0,warn:1,crit:2};
const worst=(...a)=>a.reduce((m,x)=>LV[x]>LV[m]?x:m,'ok');
const barCls=(p,w,c)=>p>=c?'c':p>=w?'w':'g';
const bar=(p,w,c)=>`<div class="bar ${barCls(p,w,c)}"><div style="width:${Math.max(0,Math.min(100,p))}%"></div></div>`;
const pill=(lv,txt)=>`<span class="pill ${lv}"><i></i>${esc(txt)}</span>`;
function dur(sec){sec=Math.floor(sec);if(sec<60)return sec+T('s');const m=Math.floor(sec/60);if(m<60)return m+' '+T('min');const h=Math.floor(m/60);if(h<48)return h+T('h')+(m%60?' '+(m%60)+T('min'):'');return Math.floor(h/24)+T('d')+' '+(h%24)+T('h')}
function ago(ts){const s=Math.floor(Date.now()/1000-ts);if(s<30)return T('now');return (lang==='es'?T('ago')+' ':'')+dur(s)+(lang==='es'?'':' '+T('ago'))}
async function jget(url){const r=await fetch(url,{credentials:'same-origin'});if(r.status===401||r.status===403){const e=new Error('auth');e.code=r.status;throw e}if(!r.ok)throw new Error(url+' '+r.status);return r.json()}
function spark(vals,cls){ // mini gráfico de línea / tiny line chart
  vals=vals.filter(v=>isFinite(v));if(vals.length<2)return '';
  const mx=Math.max(...vals,1),mn=0,W=300,H=40;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*W).toFixed(1)},${(H-2-(v-mn)/(mx-mn)*(H-4)).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts.join(' ')}" fill="none" stroke="var(--blue)" stroke-width="1.8" vector-effect="non-scaling-stroke"/><polyline points="0,${H} ${pts.join(' ')} ${W},${H}" fill="var(--blue-dim)" stroke="none"/></svg>`;
}
// Temperatura de la UPS (solo si el equipo la informa; NUT guarda 0 cuando no la tiene)
// EN: UPS temperature (only if the unit reports it; NUT stores 0 when it has none)
function upsTemp(h){
  const v=h.map(r=>r.temp).filter(x=>isFinite(x)&&x>0);if(v.length<2)return '';
  const lo=Math.floor(Math.min.apply(null,v)-1),hi=Math.max(Math.ceil(Math.max.apply(null,v)+1),lo+6),W=300,H=40,n=h.length;

function tchart(h){

  const W=300,H=40,t1=Math.max(Date.now()/1000,S[S.length-1][0]),t0=Math.max(t1-86400,S[0][0]),span=Math.max(60,t1-t0);
  const tv=S.filter(s=>s[1]!=null).map(s=>s[1]);if(tv.length<2)return '';

    const u=!!(s[2]&9);if(u&&(!pu||(s[2]&8)))uv++;pu=u;
    if(u)mark+=`<line x1="${X(s[0])}" y1="0" x2="${X(s[0])}" y2="${H}" stroke="var(--red)" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
    else if(s[2]&6)mark+=`<line x1="${X(s[0])}" y1="0" x2="${X(s[0])}" y2="${H}" stroke="var(--amber)" stroke-width="2" opacity=".55" vector-effect="non-scaling-stroke"/>`;

// ───────── Ciclo de actualización / refresh loop ─────────
async function refresh(){
  issues=[];let sevs=[];
  const jobs={};
  if(lvl('nut')){jobs.nut=jget('/nut/api/servers?range=none')}
  // El historial de Proxmox pesa más: se pide una vez por minuto / Proxmox history is heavier: requested once a minute
  const wantPH=Date.now()-pveHTs>60000;
  if(lvl('pve')){jobs.pve=jget('/pve/api/clusters'+(wantPH?'':'?hist=0'))}
  if(lvl('net')){jobs.net=jget('/net/api/hosts')}
  jobs.sys=jget('api/system');jobs.ev=jget('api/events?limit=40');
  const keys=Object.keys(jobs),res=await Promise.allSettled(Object.values(jobs));
  const R={};keys.forEach((k,i)=>R[k]=res[i]);
  if(res.some(r=>r.status==='rejected'&&r.reason&&r.reason.code===401)){return showLogin()}
  // Historial de UPS (carga y vatios): cada 60 s basta / UPS history (load and watts): every 60 s is enough
  if(R.nut&&R.nut.status==='fulfilled'&&Date.now()-histTs>60000){
    histTs=Date.now();
    const q=[];for(const sv of (R.nut.value.servers||[])){const sid=sv.id;for(const name of Object.keys((sv.status||{}).ups||{}))q.push(jget(`/nut/api/history?srv=${encodeURIComponent(sid)}&ups=${encodeURIComponent(name)}&range=1d`).then(h=>{hist[sid+'|'+name]=h.history||[]}).catch(()=>{}))}
    await Promise.all(q);
  }
  if(wantPH&&R.pve&&R.pve.status==='fulfilled'){pveHTs=Date.now();pveH={};(R.pve.value.clusters||[]).forEach(c=>{pveH[c.id]=aggHist(c)})}
  // Historial de temperatura y subtensión de la Pi (solo existe en una Raspberry Pi) / Pi history (Raspberry Pi only)
  if(R.sys.status==='fulfilled'&&Date.now()-piHTs>60000){
    piHTs=Date.now();
    try{const h=await jget('api/pihistory');piH=h&&h.pi?h:null}catch(e){}
  }
  const card=(id,show)=>$(id).classList.toggle('hide',!show);
  card('c-nut',!!R.nut);card('c-pve',!!R.pve);card('c-net',!!R.net);
  const fail=(id,name)=>{$(id).innerHTML=`<div class="ch"><h2>${name}</h2>${pill('crit',T('unreach'))}</div>`;issues.push({lv:'crit',m:name,t:`${name}: ${T('unreach')}`});return 'crit'};
  if(R.nut)sevs.push(R.nut.status==='fulfilled'?renderUPS(R.nut.value):fail('c-nut',T('ups')));
  if(R.pve)sevs.push(R.pve.status==='fulfilled'?renderPVE(R.pve.value):fail('c-pve',T('pve')));
  if(R.net)sevs.push(R.net.status==='fulfilled'?renderNet(R.net.value):fail('c-net',T('net')));
  if(R.sys.status==='fulfilled')sevs.push(renderPi(R.sys.value));
  if(R.ev.status==='fulfilled')renderEvents(R.ev.value.events||[]);
  const g=sevs.reduce((m,x)=>worst(m,x),'ok');
  const gp=$('gpill');gp.className='pill '+g;$('gtxt').textContent=g==='ok'?T('allok'):g==='warn'?T('attn'):T('fail');
  const at=$('attn');at.classList.toggle('show',issues.length>0);at.classList.toggle('c',issues.some(i=>i.lv==='crit'));
  issues.sort((a,b)=>LV[b.lv]-LV[a.lv]);
  $('attnl').innerHTML=issues.map(i=>`<li><b class="${i.lv}" style="background:none">${esc(String(i.m).toUpperCase())}</b>${i.href?`<a href="${esc(i.href)}">${esc(i.t)}</a>`:esc(i.t)}</li>`).join('');
  $('upd').textContent=T('updated')+' '+new Date().toLocaleTimeString();
}
function loop(){clearTimeout(timer);refresh().catch(()=>{}).finally(()=>{timer=setTimeout(loop,10000)})}

// ───────── Sesión / session ─────────
function showLogin(){clearTimeout(timer);$('app').classList.add('hide');$('loginbox').classList.remove('hide');$('lu').focus()}
async function start(){
  try{me=await jget('api/me')}catch(e){me={}}
  if(!me.username)return showLogin();
  $('loginbox').classList.add('hide');$('app').classList.remove('hide');loop();
}
async function doLogin(){
  $('lerr').textContent='';
  const r=await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('lu').value,password:$('lp').value})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.ok){$('lerr').textContent=d.error||T('invalid');return}
  if(d.must_change_password){location.href='/admin/change-password?next='+encodeURIComponent('/overview/');return}
  $('lp').value='';start();
}
$('lgo').onclick=doLogin;$('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
$('bo').onclick=async()=>{await fetch('api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});me={};showLogin()};

// ───────── Idioma / language ─────────
function applyLang(){
  document.documentElement.lang=lang;document.title='Pi Console — '+T('title');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
  $('bl').textContent=lang==='es'?'EN':'ES';
  $('lu').placeholder=lang==='es'?'Usuario':'User';$('lp').placeholder=lang==='es'?'Contraseña':'Password';
}
$('bl').onclick=()=>{lang=lang==='es'?'en':'es';try{localStorage.setItem('pi-lang',lang)}catch(e){}applyLang();if(me&&me.username){histTs=0;refresh()}};

// ───────── Modo kiosko / kiosk mode ─────────
let wl=null;
async function setKiosk(on){
  document.body.classList.toggle('kiosk',on);document.documentElement.classList.toggle('kiosk',on);if(on&&typeof asOn!=='undefined'){asOn=false;asPaint()}
  try{const u=new URL(location.href);on?u.searchParams.set('kiosk','1'):u.searchParams.delete('kiosk');history.replaceState(null,'',u)}catch(e){}
  try{
    if(on){if(document.documentElement.requestFullscreen&&!document.fullscreenElement)await document.documentElement.requestFullscreen();if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}
    else{if(document.fullscreenElement)await document.exitFullscreen();if(wl){wl.release();wl=null}}
  }catch(e){}
}
$('bk').onclick=()=>setKiosk(true);$('kx').onclick=()=>{if(kbarReady())setKiosk(false)};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('kiosk')){document.body.classList.remove('kiosk');document.documentElement.classList.remove('kiosk')}});
// La barra de botones del kiosko aparece al mover el mouse o tocar la pantalla; el primer toque solo la muestra (no pulsa un botón aún invisible).
// EN: The kiosk button bar shows up on mouse move or touch; the first touch only reveals it (it doesn't press a still-invisible button).
let mv=null,kShown=0;
const kbarReady=()=>Date.now()-kShown>350;
const showKx=()=>{
  if(!document.body.classList.contains('moved'))kShown=Date.now();
  const el=document.scrollingElement||document.documentElement;$('ka').classList.toggle('hide',el.scrollHeight-el.clientHeight<=8);
  document.body.classList.add('moved');clearTimeout(mv);mv=setTimeout(()=>document.body.classList.remove('moved'),4000)};
document.addEventListener('mousemove',showKx);document.addEventListener('touchstart',showKx,{passive:true});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&document.body.classList.contains('kiosk')&&navigator.wakeLock){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}});

// Desplazamiento automático en modo kiosko, para cuando el contenido no cabe en la pantalla (tablets chicas).
// Viene APAGADO: se activa con el botón «Auto-desplazar» que aparece al tocar la pantalla (o abriendo con ?autoscroll=1).
// Sube y baja despacio, hace pausa arriba y abajo, y se detiene 30 s si se toca la pantalla.
// EN: Automatic scrolling in kiosk mode, for when the content doesn't fit the screen (small tablets).
// It starts OFF: turn it on with the "Auto-scroll" button that shows up when the screen is touched (or open with ?autoscroll=1).
// It moves slowly up and down, pauses at the top and bottom, and stops for 30 s on touch.
let asDir=1,asHold=Date.now()+8000;
let asOn=new URLSearchParams(location.search).get('autoscroll')==='1';
const asPaint=()=>{$('ka').classList.toggle('on',asOn);$('ka').setAttribute('aria-pressed',asOn?'true':'false')};
$('ka').onclick=()=>{if(!kbarReady())return;asOn=!asOn;asDir=1;asHold=Date.now()+1500;asPaint()};
asPaint();
const asTouch=()=>{asHold=Date.now()+30000};
['touchstart','wheel','keydown'].forEach(ev=>document.addEventListener(ev,asTouch,{passive:true}));
setInterval(()=>{
  if(!asOn||!document.body.classList.contains('kiosk')||Date.now()<asHold)return;
  const el=document.scrollingElement||document.documentElement,max=el.scrollHeight-el.clientHeight;
  if(max<=8)return;
  const y=el.scrollTop;
  if(asDir>0&&y>=max-1){asDir=-1;asHold=Date.now()+8000;return}
  if(asDir<0&&y<=0){asDir=1;asHold=Date.now()+8000;return}
  window.scrollBy(0,asDir);
},50);

applyLang();
try{const z=parseFloat(new URLSearchParams(location.search).get('zoom'));if(z>=0.5&&z<=2)document.documentElement.style.setProperty('--kz',z)}catch(e){}
if(new URLSearchParams(location.search).get('kiosk')==='1'){document.body.classList.add('kiosk');document.documentElement.classList.add('kiosk')}
start();
</script>
