<body>
<!-- Resumen de LabTower: estado global, tarjetas de UPS, Proxmox, red y Pi, y línea de tiempo de eventos. Consulta las APIs de los otros módulos con la misma sesión. -->
<!-- EN: LabTower overview: global status, UPS, Proxmox, network and Pi cards, and an event timeline. It queries the other modules' APIs with the same session. -->
<div id="loginbox" class="login hide">
  <h1 style="font-size:1.1rem">LabTower — <span data-i="title">Overview</span></h1>
  <input id="lu" placeholder="User" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password">
  <div class="remember-row"><label class="remember-chk"><input type="checkbox" id="l-rem" ><span data-i="rememberMe">Remember me</span></label><select id="l-remsel" disabled aria-label="Remember me"><option value="day" data-i="rem1d">1 day</option><option value="week" data-i="rem1w">1 week</option><option value="month" data-i="rem1m">1 month</option><option value="forever" data-i="remForever">Forever</option></select></div>
  <div class="err" id="lerr"></div><button class="btn" id="lgo" data-i="login">Sign in</button>
</div>

<div class="wrap hide" id="app">
  <div class="top">
    <h1><img class="logo" src="/logo.png" width="30" height="30" alt=""><span data-i="title">Overview</span></h1>
    <span class="pill none" id="gpill"><i></i><span id="gtxt">…</span></span>
    <span class="spacer"></span>
    <span class="upd" id="upd"></span>
    <select class="btn nokiosk" id="ri" aria-label="Refresh interval"></select><button class="btn nokiosk" id="rr" aria-label="Refresh now">↻</button>
    <a class="btn nokiosk" href="/" data-i="home">Home</a>
    <button class="btn nokiosk hide" id="bs0">Reset order</button><button class="btn nokiosk" id="bs">Reorder</button>
    <button class="btn nokiosk" id="bk" data-i="kiosk">Kiosk</button>
    <button class="btn nokiosk" id="bl">ES</button>
    <button class="btn nokiosk" id="bo" data-i="logout">Sign out</button>
  </div>
  <div class="attn" id="attn"><ul id="attnl"></ul></div>
  <div class="grid" id="grid">
    <section class="card hide" id="c-nut"></section>
    <section class="card hide" id="c-pve"></section>
    <section class="card hide" id="c-nas"></section>
    <section class="card hide" id="c-net"></section>
    <section class="card" id="c-pi"></section>
  </div>
  <!-- ES: La línea de tiempo va FUERA de la grilla: dentro, al ocupar todas las columnas (1/-1), dejaba una columna vacía a la derecha de las tarjetas. EN: The timeline sits OUTSIDE the grid: inside it, spanning every column (1/-1) left an empty column to the right of the cards. -->
  <section class="card wide" id="c-ev"></section>
</div>
<div id="kbar"><button class="btn hide" id="ka" data-i="ascroll" aria-pressed="false">Auto-scroll</button><button class="btn" id="kx" data-i="exitk">Exit kiosk</button></div>

<script src="timefmt.js"></script>
<script src="app.js"></script>
<script src="pidetail.js"></script>
<script src="ipcard.js"></script>
</body>
</html>
