# Pi Console — automatic backup over SFTP (/usr/local/bin/pi-console-sftp-backup)
# ES: Respaldo automático de Pi Console por SFTP. Está desactivado mientras SFTP_USER esté vacío.
#
# Quick start / Puesta en marcha:
#   1) sudo pi-console-sftp-backup setup     creates the SSH key and shows the public key to authorize on the storage
#                                       (crea la llave SSH y muestra la llave pública para autorizarla en el storage)
#   2) set SFTP_USER below              (completa SFTP_USER aquí abajo)
#   3) sudo pi-console-sftp-backup test      checks connection, folder and write access (revisa conexión, carpeta y escritura)
#   4) sudo pi-console-sftp-backup run       makes one backup now (hace un respaldo ahora); then cron runs it every day at 03:17
#                                       (después cron lo ejecuta todos los días a las 03:17; se cambia en /etc/cron.d/pi-console-sftp-backup)
#
# Only KEY=value lines are read; nothing in this file is executed. Values: letters, digits and . _ - / only.
# ES: Solo se leen líneas CLAVE=valor; nada de este archivo se ejecuta. Valores: letras, números y . _ - / únicamente.

# Storage server / servidor de almacenamiento
SFTP_HOST=storage.example.lan
SFTP_PORT=22
# User on the storage. Empty = backups disabled. / Usuario en el storage. Vacío = respaldo desactivado.
SFTP_USER=
# Folder on the storage: relative to the user's home or absolute (it must exist or the user must be able to create it;
# only the last level is created). / Carpeta en el storage: relativa al home del usuario o absoluta.
SFTP_DIR=pi-console-sftp-backups

# How many copies to keep. Only files named pi-console-auto-<this host>-<date>_<time>.tar.gz are ever deleted.
# ES: Cuántas copias conservar. Solo se borran archivos con ese nombre; nada más.
KEEP_REMOTE=30
KEEP_LOCAL=7

# Encrypt the copy that is uploaded (gpg, AES-256) / cifrar la copia que se sube. The passphrase is created on the first run in
# /etc/pi-console/backup_passphrase: COPY IT somewhere safe off this Pi — without it the backups cannot be opened.
# ES: La contraseña se crea en la primera ejecución: GUÁRDALA fuera de la Pi; sin ella no se pueden abrir los respaldos.
# Decrypt a downloaded copy with: pi-console-sftp-backup decrypt <file.tar.gz.gpg>
ENCRYPT=yes

# Advanced / Avanzado (normally untouched)
#PASSPHRASE_FILE=/etc/pi-console/backup_passphrase
#SFTP_KEY=/etc/pi-console/backup_key
#KNOWN_HOSTS=/etc/pi-console/backup_known_hosts
#LOCAL_DIR=/var/backups/pi-console
