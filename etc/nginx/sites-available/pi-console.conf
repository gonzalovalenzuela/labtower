server {
    # Pi Console completo detrás de un solo puerto (80). nginx reparte por ruta a cada servicio, que escucha solo en 127.0.0.1: /wol→8080, /nut→8081, /admin→8082, /net→8083, /pve→8084, y la portada en /.
    # EN: All of Pi Console behind a single port (80). nginx routes by path to each service, which listens on 127.0.0.1 only: /wol→8080, /nut→8081, /admin→8082, /net→8083, /pve→8084, and the home page at /.
    listen 80;
    server_name _;

    # Log de acceso con buffer: la página consulta la API cada 5 s y una línea por
    # petición desgasta la SD. Se escribe en bloques de 64 KB o cada 5 minutos.
    # EN: Buffered access log: the page polls the API every 5 s and one line per request wears out the SD card. It is written in 64 KB blocks or every 5 minutes.
    access_log /var/log/nginx/access.log combined buffer=64k flush=5m;

    # Cabeceras de seguridad (las páginas usan scripts/estilos en línea y Google Fonts)
    # EN: Security headers (the pages use inline scripts/styles and Google Fonts).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location /wol/ {
        proxy_pass         http://127.0.0.1:8080/;
        proxy_set_header   Host              $host;
        # nginx pasa la IP real del cliente en X-Real-IP: los servicios solo confían en ella cuando la conexión viene de 127.0.0.1 (ver auth.client_ip).
        # EN: nginx passes the client's real IP in X-Real-IP: the services trust it only when the connection comes from 127.0.0.1 (see auth.client_ip).
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    location /nut/ {
        proxy_pass         http://127.0.0.1:8081/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    location /admin/ {
        proxy_pass         http://127.0.0.1:8082/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Teleporter: subir/descargar respaldos y crearlos puede tardar en una Pi
        # EN: Teleporter: uploading/downloading backups and creating them can take a while on a Pi.
        client_max_body_size    200m;
        client_body_timeout     120s;
        proxy_request_buffering off;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
    }

    location /net/ {
        proxy_pass         http://127.0.0.1:8083/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /pve/ {
        proxy_pass         http://127.0.0.1:8084/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location / {
        # Portada con los accesos a cada módulo (archivos estáticos).
        # EN: Home page with the links to each module (static files).
        root /opt/pi-console-home;
        try_files $uri /index.html;
    }
}
