# LabTower completo detrás de un solo puerto (80). nginx reparte por ruta a cada servicio, que escucha solo en 127.0.0.1: /wol→8080, /nut→8081, /admin→8082, /net→8083, /pve→8084, /nas→8086, /dns→8087, /wan→8088, /overview→8085, y la portada en /. Las rutas y cabeceras están en snippets/labtower-site.conf.
# EN: All of LabTower behind a single port (80). nginx routes by path to each service, which listens on 127.0.0.1 only: /wol→8080, /nut→8081, /admin→8082, /net→8083, /pve→8084, /nas→8086, /dns→8087, /wan→8088, /overview→8085, and the home page at /. The routes and headers live in snippets/labtower-site.conf.

# Zonas de límite (este archivo se incluye dentro de «http»).
# EN: Limit zones (this file is included inside "http").
limit_req_zone  $binary_remote_addr zone=labtower_api:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=labtower_login:1m  rate=10r/m;
limit_conn_zone $binary_remote_addr zone=labtower_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# HTTPS opcional: «labtower-https enable» deja aquí su servidor 443 (ver /usr/share/doc/labtower/README.md). Sin archivos, no hace nada.
# EN: Optional HTTPS: "labtower-https enable" puts its 443 server here. With no files it does nothing.
include /etc/labtower/https.d/*.conf;

server {
    listen 80;
    server_name _;
    # No revelar la versión de nginx en cabeceras ni en páginas de error.
    # EN: Do not reveal the nginx version in headers or error pages.
    server_tokens off;

    # Log de acceso con buffer: la página consulta la API cada 5 s y una línea por
    # petición desgasta la SD. Se escribe en bloques de 64 KB o cada 5 minutos.
    # EN: Buffered access log: the page polls the API every 5 s and one line per request wears out the SD card. It is written in 64 KB blocks or every 5 minutes.
    access_log /var/log/nginx/access.log combined buffer=64k flush=5m;

    # «labtower-https enable --redirect» deja aquí un «return 301 https://…».
    # EN: "labtower-https enable --redirect" puts a "return 301 https://…" here.
    include /etc/labtower/http-extra.d/*.conf;

    include snippets/labtower-site.conf;
}
