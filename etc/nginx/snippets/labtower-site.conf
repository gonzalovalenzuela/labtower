# Manifest de la app web (iPad: «Añadir a pantalla de inicio»). El tipo se fija aquí porque algunos mime.types de nginx no conocen .webmanifest.
# EN: Web-app manifest (iPad: "Add to Home Screen"). The type is set here because some nginx mime.types do not know .webmanifest.
location = /manifest.webmanifest {
    root /opt/labtower/home;
    types { }
    default_type application/manifest+json;
    expires 1h;
}

location / {
    # Portada con los accesos a cada módulo (archivos estáticos).
    # EN: Home page with the links to each module (static files).
    root /opt/labtower/home;
    try_files $uri /index.html;
}
