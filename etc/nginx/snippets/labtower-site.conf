# ES: Solo la subida de respaldos admite cuerpos grandes y sin búfer; el resto de /admin/ conserva el límite de 1 MB.
# EN: Only the backup upload accepts big bodies without buffering; the rest of /admin/ keeps the 1 MB limit.
location = /admin/api/teleporter/upload {
    proxy_pass         http://127.0.0.1:8082/api/teleporter/upload;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Port  $server_port;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    client_max_body_size    200m;
    client_body_timeout     120s;
    proxy_request_buffering off;
    proxy_read_timeout      300s;
    proxy_send_timeout      300s;
}

location /admin/ {
    proxy_pass         http://127.0.0.1:8082/;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Port  $server_port;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Teleporter: descargar respaldos y crearlos puede tardar en un servidor lento (la subida tiene su propio bloque, arriba).
    # EN: Teleporter: downloading backups and creating them can take a while on a server (the upload has its own block, above).
    proxy_read_timeout      300s;
    proxy_send_timeout      300s;
}

