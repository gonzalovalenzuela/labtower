# Pi Console — contenido común del sitio (cabeceras, límites y rutas hacia cada servicio). Lo incluyen el servidor HTTP (80) y, si se activa con
# «pi-console-https enable», el HTTPS (443). Es un archivo de configuración del paquete: si lo editas, dpkg te preguntará al actualizar.
# EN: Pi Console — common site content (headers, limits and routes to each service). Included by the HTTP server (80) and, if enabled with
#     "pi-console-https enable", the HTTPS one (443). It is a package conffile: if you edit it, dpkg will ask on upgrade.

# Cabeceras de seguridad. La CSP no admite JavaScript en línea ni <style> en línea: el código de las páginas va en archivos .js/.css. Solo se permiten
# atributos style="…" (style-src-attr), necesarios para anchos y colores calculados; los scripts son siempre 'self'. Google Fonts para la tipografía.
# EN: Security headers. The CSP allows no inline JavaScript and no inline <style>: page code lives in .js/.css files. Only style="…" attributes are allowed
#     (style-src-attr), needed for computed widths and colours; scripts are always 'self'. Google Fonts for the typeface.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# Límites por IP: protegen a una Pi pequeña de ráfagas y de conexiones abiertas sin fin (las zonas se declaran en el sitio).
# EN: Per-IP limits: they protect a small Pi from bursts and endless open connections (the zones are declared in the site file).
limit_req  zone=piconsole_api burst=60 nodelay;
limit_conn piconsole_conn 40;
client_max_body_size 1m;
client_body_timeout  15s;
client_header_timeout 15s;
send_timeout         30s;

location /wol/ {
    proxy_pass         http://127.0.0.1:8080/;
    proxy_set_header   Host              $host;
    # nginx pasa la IP real del cliente en X-Real-IP: los servicios solo confían en ella cuando la conexión viene de 127.0.0.1 (ver auth.client_ip).
    # EN: nginx passes the client's real IP in X-Real-IP: the services trust it only when the connection comes from 127.0.0.1 (see auth.client_ip).
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout 10s;
}

location /nut/ {
    proxy_pass         http://127.0.0.1:8081/;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout 15s;
}

# ES: El inicio de sesión tiene su propio límite (10 intentos/min por IP); además el servicio aplica su bloqueo por cuenta.
# EN: Login has its own limit (10 attempts/min per IP); the service also applies its per-account lockout.
location = /admin/api/login {
    limit_req          zone=piconsole_login burst=5 nodelay;
    limit_req          zone=piconsole_api burst=60 nodelay;
    proxy_pass         http://127.0.0.1:8082/api/login;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    client_max_body_size 16k;
}

location /admin/ {
    proxy_pass         http://127.0.0.1:8082/;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Teleporter: subir/descargar respaldos y crearlos puede tardar en una Pi
    # EN: Teleporter: uploading/downloading backups and creating them can take a while on a Pi.
    client_max_body_size    200m;
    client_body_timeout     120s;
    proxy_request_buffering off;
    proxy_read_timeout      300s;
    proxy_send_timeout      300s;
}

location /net/ {
    proxy_pass         http://127.0.0.1:8083/;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
}

location /pve/ {
    proxy_pass         http://127.0.0.1:8084/;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
}

location /overview/ {
    proxy_pass         http://127.0.0.1:8085/;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout 15s;
}

location / {
    # Portada con los accesos a cada módulo (archivos estáticos).
    # EN: Home page with the links to each module (static files).
    root /opt/pi-console/home;
    try_files $uri /index.html;
}
